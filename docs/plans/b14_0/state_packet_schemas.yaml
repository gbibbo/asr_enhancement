schema_version: "1.0.0-b14_0-draft"
schema_owner: state_packet_schemas
authoring_status: APPROVED_FOR_EXECUTION
accepted_plan_revision_commit: 8a049d00bdfec5b97c416f3135644ecd78f14bd8
applies_to_plans:
  - orchestrator_plan: docs/plans/b14_0/orchestrator_plan.md
  - agent_plan: docs/plans/b14_0/agent_plan.md

drift_handling:
  if_orchestrator_or_agent_disagrees_with_schema:
    marker: PLAN_CONFLICT
    stop: true
    resolve_via: CHANGE_SCOPE
  if_agent_marker_missing_from_orchestrator_registry: {marker: PLAN_CONFLICT, stop: true}
  if_orchestrator_marker_missing_from_agent_registry: {marker: PLAN_CONFLICT, stop: true}
  if_recovery_packet_missing_for_marker: {marker: RECOVERY_PACKET_GAP, stop: true}
  if_approval_packet_missing_wrapper: {marker: APPROVAL_PACKET_MALFORMED, stop: true}

schema_constraints:
  schema_must_not_contain:
    - implementation_commands
    - validator_script_paths_as_runtime_actions
    - approval_decisions
    - phase_gate_predicates_as_authority
    - tracker_runtime_state_values
    - recruiter_credential_values
    - admin_credential_values
    - public_URL_literals
  cross_document_invariants:
    - every_agent_marker_exists_in_orchestrator_marker_registry
    - every_orchestrator_marker_exists_in_agent_marker_registry
    - every_marker_has_agent_recovery_packet
    - every_orchestrator_hard_stop_marker_has_recovery_packet
    - approval_packet_fields_match_orchestrator_section_2

# ---- inherited shapes (semantics identical to docs/plans/broute/state_packet_schemas.yaml) ----

state_packet:
  description: shape of runtime state snapshot, not ownership of runtime values
  fields: [repo_root, branch, head_commit, working_tree_status, current_phase, current_task, last_completed_task, active_markers, latest_planning_report_path, latest_execution_report_path, latest_phase_gate_report_path, latest_approval_packet, expected_next_task, requested_task_matches_tracker]
  required_fields: [repo_root, branch, head_commit, working_tree_status, current_phase, current_task, last_completed_task, active_markers, expected_next_task, requested_task_matches_tracker]
  enum_values:
    requested_task_matches_tracker: [true, false]

planning_report:
  section_order: [STATE SNAPSHOT, TRACKER-DERIVED NEXT TASK, TASK SCOPE, PLANNED COMMITTED FILES, LOCAL-ONLY EVIDENCE, COMMANDS TO RUN, VALIDATION PLAN, EXPECTED POST-EXECUTION STATE, RISKS_OR_BLOCKERS, STOP CONDITION]
  required_fields: [state_snapshot, tracker_derived_next_task, task_scope, planned_committed_files, local_only_evidence, commands_to_run, validation_plan, expected_post_execution_state, risks_or_blockers, stop_condition]

execution_report:
  section_order: [STATE BEFORE, TASK EXECUTED, FILES CHANGED AND COMMITTED, LOCAL-ONLY EVIDENCE REMOVED, VALIDATION RESULTS, COMMIT AND PUSH, STATE AFTER, STOP CONDITION]
  required_fields: [state_before, task_executed, files_changed_and_committed, local_only_evidence_removed, validation_results, commit_and_push, state_after, stop_condition]
  command_result_shape: [command, exit_code, sentinel_observed]
  artifact_check_shape: [path, exists, size_bytes, sha256]

phase_gate_report:
  section_order: [STATE SNAPSHOT, PHASE, GATE PREDICATES, VALIDATION RESULTS, CLAIM STATUS, FUTURE CONSTRAINTS, NEXT EXPECTED PHASE, BLOCKERS]
  required_fields: [state_snapshot, phase, gate_predicates, validation_results, claim_status, future_constraints, next_expected_phase, blockers]

approval_packet:
  wrapper:
    name: ORCHESTRATOR_DECISION
    only_top_level_key_allowed: true
  fields:
    scope: {type: enum, required: true, enum_values: [task, phase, scope_change]}
    task_id: {type: string_or_null, required: true}
    phase: {type: string_or_null, required: true}
    decision: {type: enum, required: true, enum_values: [APPROVE_PLAN, REVISE_PLAN, STOP_SCOPE_CONFLICT, CLOSE_TASK, FIX_BEFORE_CLOSE, PHASE_APPROVE, PHASE_REJECT, CHANGE_SCOPE]}
    accepted_report_commit: {type: string_or_null, required: true}
    next_expected_task: {type: string_or_null, required: true}
    required_fix: {type: string_or_null, required: true}
    rationale: {type: string, required: true}
  required_fields: [scope, task_id, phase, decision, accepted_report_commit, next_expected_task, required_fix, rationale]

supplemental_evidence_report:
  section_order: [STATE SNAPSHOT, QUESTION, READ_ONLY_COMMANDS_RUN, EVIDENCE_ROWS, LIMITS, STOP CONDITION]
  required_fields: [state_snapshot, question, read_only_commands_run, evidence_rows, limits, stop_condition]

human_action_request:
  fields: [request_id, marker, missing_inputs, why_human_only, allowed_values_or_schema, blocks, created_by_task, next_state_until_result, forbidden_agent_action, result_expected_at]
  required_fields: [request_id, marker, missing_inputs, why_human_only, allowed_values_or_schema, blocks, created_by_task, next_state_until_result, forbidden_agent_action, result_expected_at]

human_action_result:
  fields: [request_id, supplied_values, waiver_if_any, evidence_reference, accepted_by_orchestrator_decision, next_state]
  required_fields: [request_id, supplied_values, evidence_reference, accepted_by_orchestrator_decision, next_state]

path_lock_record:
  fields: [lock_id, type, detection_command, include_predicate, exclude_predicate, allowed_symbols_or_components, validator_command, max_changed_files, unauthorized_marker]
  required_fields: [lock_id, type, detection_command, include_predicate, exclude_predicate, allowed_symbols_or_components, validator_command, max_changed_files, unauthorized_marker]

security_invariant_record:
  fields: [invariant_id, source_section, protected_surface, forbidden_regression, validator, marker]
  required_fields: [invariant_id, source_section, protected_surface, forbidden_regression, validator, marker]

blocking_marker_recovery_record:
  fields: [packet_id, marker, diagnosis_command, allowed_files_to_inspect, allowed_files_to_modify, forbidden_files, retry_limit, next_state_on_recovered, next_state_on_retry_exhausted, human_escalation_allowed, human_escalation_packet_if_allowed]
  required_fields: [packet_id, marker, diagnosis_command, allowed_files_to_inspect, allowed_files_to_modify, retry_limit, next_state_on_recovered, next_state_on_retry_exhausted]

tracker_task_record:
  fields: [task_id, status, commit, files_changed, commands_run, key_outputs, marker, next_task]
  required_fields: [task_id, status, commit, files_changed, commands_run, key_outputs, marker, next_task]
  enum_values:
    status: [PENDING, PLANNED, IN_PROGRESS, PASS, FAIL, HALTED, SKIPPED_BY_FUTURE_SCOPE]

artifact_record:
  fields: [artifact_id, path, produced_by_task, exists, size_bytes, sha256, validator]
  required_fields: [artifact_id, path, produced_by_task, exists, size_bytes, sha256, validator]

orchestrator_approval_record:
  fields: [approval_id, approval_packet, recorded_at_commit, accepted_report_commit, next_expected_task]
  required_fields: [approval_id, approval_packet, recorded_at_commit, accepted_report_commit, next_expected_task]

future_constraint_preservation_record:
  fields: [constraint_id, source_section, current_scope_impact, must_preserve_in_current_plan, forbidden_current_plan_regression, validator_or_review_check, future_phase_owner, out_of_scope_but_preserved]
  required_fields: [constraint_id, source_section, current_scope_impact, must_preserve_in_current_plan, forbidden_current_plan_regression, validator_or_review_check, future_phase_owner, out_of_scope_but_preserved]

phase_approval_record:
  fields: [phase, status, decision, accepted_phase_gate_report_commit, accepted_tracker_closure_commit, approval_packet_path, phase_gate_report_path, next_phase, next_phase_status]
  required_fields: [phase, status, decision, accepted_phase_gate_report_commit, accepted_tracker_closure_commit, approval_packet_path, phase_gate_report_path, next_phase, next_phase_status]
  enum_values:
    status: [APPROVED, REJECTED]
    decision: [PHASE_APPROVE, PHASE_REJECT, CHANGE_SCOPE]

# ---- B14.0-specific records ----

recruiter_auth_invariant_record:
  fields: [invariant_id, protected_route_glob, expected_unauthenticated_status, expected_www_authenticate_value, expected_authenticated_health_payload, forbidden_response_body_substrings, validator, marker]
  required_fields: [invariant_id, protected_route_glob, expected_unauthenticated_status, expected_www_authenticate_value, expected_authenticated_health_payload, forbidden_response_body_substrings, validator, marker]
  enum_values:
    expected_unauthenticated_status: [401]
  fixed_values:
    expected_www_authenticate_value: 'Basic realm="asr-demo-recruiter"'
    expected_authenticated_health_payload: '{"status":"ok"}'

credential_storage_policy_record:
  fields: [policy_id, credential_name, source, allowed_storage, forbidden_storage, rotation_policy, validator, marker]
  required_fields: [policy_id, credential_name, source, allowed_storage, forbidden_storage, rotation_policy, validator, marker]
  enum_values:
    source: [environment_variable]
    allowed_storage: [environment_variable, host_systemd_service_env]
    forbidden_storage: [git_committed_file, dockerfile_literal, compose_file_literal, plan_file_literal, log_output, error_response_body]

auth_separation_invariant_record:
  fields: [invariant_id, surface_a, surface_b, separation_dimension, validator, marker]
  required_fields: [invariant_id, surface_a, surface_b, separation_dimension, validator, marker]
  enum_values:
    separation_dimension: [realm, username, password, route_prefix, error_path]
