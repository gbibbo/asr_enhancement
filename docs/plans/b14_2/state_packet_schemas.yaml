schema_version: "1.0.0-b14_2-draft"
schema_owner: state_packet_schemas
authoring_status: DRAFT_NOT_APPROVED_FOR_EXECUTION
preceded_by_phase: B15
b15_accepted_phase_gate_report_commit: 6bcfaee57df7a1e8f7026916b472559b3cadcbbc
b15_accepted_tracker_closure_commit: bf8560a6c3493692ccd8a35926a5ddc647b627f6
b15_decision_rule_routing: RETURN_TO_B14
b14_2_plan_authoring_input_accepted_report_commit: null
applies_to_plans:
  - orchestrator_plan: docs/plans/b14_2/orchestrator_plan.md
  - agent_plan: docs/plans/b14_2/agent_plan.md

drift_handling:
  if_orchestrator_or_agent_disagrees_with_schema:
    marker: PLAN_CONFLICT
    stop: true
    resolve_via: CHANGE_SCOPE
  if_agent_marker_missing_from_orchestrator_registry: {marker: PLAN_CONFLICT, stop: true}
  if_orchestrator_marker_missing_from_agent_registry: {marker: PLAN_CONFLICT, stop: true}
  if_recovery_packet_missing_for_marker: {marker: RECOVERY_PACKET_GAP, stop: true}
  if_approval_packet_missing_wrapper: {marker: APPROVAL_PACKET_MALFORMED, stop: true}
  if_human_action_request_missing_wrapper: {marker: HUMAN_ACTION_REQUEST_MALFORMED, stop: true}
  if_b14_2_record_asserts_success_with_stable_named_exposure: {marker: B14_2_EPHEMERAL_URL_SUCCESS_CLAIM, stop: true}
  if_b14_2_record_clears_carried_marker_outside_phase_approval_recording: {marker: B14_2_CARRIED_MARKER_CLEARED_OUT_OF_BAND, stop: true}
  if_b14_2_record_converts_unauthenticated_access_observed_to_authenticated_access_only: {marker: B14_2_PUBLIC_SURFACE_RESMOKE_FABRICATED, stop: true}
  if_b14_2_record_converts_upload_with_manual_ground_truth_fail_to_pass_without_matching_b14_2_04_evidence: {marker: B14_2_UPLOAD_WITH_GT_SILENT_ABSORPTION, stop: true}

schema_constraints:
  schema_must_not_contain:
    - implementation_commands
    - validator_script_paths_as_runtime_actions
    - approval_decisions
    - phase_gate_predicates_as_authority
    - tracker_runtime_state_values
    - recruiter_credential_values
    - admin_credential_values
    - tailscale_auth_key_values
    - cloudflare_token_values
    - public_URL_literals
    - stable_hostname_literals
    - ip_address_literals_non_loopback
  cross_document_invariants:
    - every_agent_marker_exists_in_orchestrator_marker_registry
    - every_orchestrator_marker_exists_in_agent_marker_registry
    - every_marker_has_agent_recovery_packet
    - every_orchestrator_hard_stop_marker_has_recovery_packet
    - approval_packet_fields_match_orchestrator_section_2
    - every_b14_2_har_id_has_har_record_and_recovery_packet
    - public_surface_recruiter_gate_resmoke_record_must_cite_an_operator_evidence_reference
    - public_surface_recruiter_gate_resmoke_coverage_must_be_four_vantage_points
    - b14_2_public_surface_claim_record_must_cite_gate_restored_or_blocked_or_failed
    - upload_with_gt_secondary_observation_record_must_derive_from_b14_2_04_evidence

# ---- inherited shapes (semantics identical to docs/plans/b15/state_packet_schemas.yaml) ----

state_packet:
  description: shape of runtime state snapshot, not ownership of runtime values
  fields: [repo_root, branch, head_commit, working_tree_status, current_phase, current_task, last_completed_task, active_markers, latest_planning_report_path, latest_execution_report_path, latest_phase_gate_report_path, latest_approval_packet, expected_next_task, requested_task_matches_tracker]
  required_fields: [repo_root, branch, head_commit, working_tree_status, current_phase, current_task, last_completed_task, active_markers, expected_next_task, requested_task_matches_tracker]
  enum_values:
    requested_task_matches_tracker: [true, false]

planning_report:
  section_order: [STATE SNAPSHOT, TRACKER-DERIVED NEXT TASK, TASK SCOPE, PLANNED COMMITTED FILES, LOCAL-ONLY EVIDENCE, COMMANDS TO RUN, VALIDATION PLAN, EXPECTED POST-EXECUTION STATE, RISKS_OR_BLOCKERS, STOP CONDITION]
  required_fields: [state_snapshot, tracker_derived_next_task, task_scope, planned_committed_files, local_only_evidence, commands_to_run, validation_plan, expected_post_execution_state, risks_or_blockers, stop_condition]

execution_report:
  section_order: [STATE BEFORE, TASK EXECUTED, FILES CHANGED AND COMMITTED, LOCAL-ONLY EVIDENCE REMOVED, VALIDATION RESULTS, COMMIT AND PUSH, STATE AFTER, STOP CONDITION]
  required_fields: [state_before, task_executed, files_changed_and_committed, local_only_evidence_removed, validation_results, commit_and_push, state_after, stop_condition]
  command_result_shape: [command, exit_code, sentinel_observed]
  artifact_check_shape: [path, exists, size_bytes, sha256]

phase_gate_report:
  section_order: [STATE SNAPSHOT, PHASE, GATE PREDICATES, VALIDATION RESULTS, CLAIM STATUS, FUTURE CONSTRAINTS, NEXT EXPECTED PHASE, BLOCKERS]
  required_fields: [state_snapshot, phase, gate_predicates, validation_results, claim_status, future_constraints, next_expected_phase, blockers]

approval_packet:
  wrapper:
    name: ORCHESTRATOR_DECISION
    only_top_level_key_allowed: true
  fields:
    scope: {type: enum, required: true, enum_values: [task, phase, scope_change, plan_authoring]}
    task_id: {type: string_or_null, required: true}
    phase: {type: string_or_null, required: true}
    decision: {type: enum, required: true, enum_values: [APPROVE_PLAN, REVISE_PLAN, STOP_SCOPE_CONFLICT, CLOSE_TASK, CLOSE_TASK_WITH_OBSERVED_REGRESSIONS, FIX_BEFORE_CLOSE, PHASE_APPROVE, PHASE_REJECT, CHANGE_SCOPE, REQUEST_PLAN_AUTHORING, APPROVE_FOR_EXECUTION]}
    accepted_report_commit: {type: string_or_null, required: true}
    next_expected_task: {type: string_or_null, required: true}
    required_fix: {type: string_or_null, required: true}
    rationale: {type: string, required: true}
  required_fields: [scope, task_id, phase, decision, accepted_report_commit, next_expected_task, required_fix, rationale]

supplemental_evidence_report:
  section_order: [STATE SNAPSHOT, QUESTION, READ_ONLY_COMMANDS_RUN, EVIDENCE_ROWS, LIMITS, STOP CONDITION]
  required_fields: [state_snapshot, question, read_only_commands_run, evidence_rows, limits, stop_condition]

human_action_request:
  fields: [request_id, marker, missing_inputs, why_human_only, allowed_values_or_schema, blocks, created_by_task, next_state_until_result, forbidden_agent_action, result_expected_at]
  required_fields: [request_id, marker, missing_inputs, why_human_only, allowed_values_or_schema, blocks, created_by_task, next_state_until_result, forbidden_agent_action, result_expected_at]

human_action_result:
  fields: [request_id, supplied_values, waiver_if_any, evidence_reference, accepted_by_orchestrator_decision, next_state]
  required_fields: [request_id, supplied_values, evidence_reference, accepted_by_orchestrator_decision, next_state]

path_lock_record:
  fields: [lock_id, type, detection_command, include_predicate, exclude_predicate, allowed_symbols_or_components, validator_command, max_changed_files, unauthorized_marker]
  required_fields: [lock_id, type, detection_command, include_predicate, exclude_predicate, allowed_symbols_or_components, validator_command, max_changed_files, unauthorized_marker]

recovery_packet_record:
  fields: [packet_id, marker, diagnosis_command, allowed_files_to_inspect, allowed_files_to_modify, forbidden_files, retry_limit, next_state_on_recovered, next_state_on_retry_exhausted, human_escalation_allowed, human_escalation_packet_if_allowed]
  required_fields: [packet_id, marker, diagnosis_command, allowed_files_to_inspect, allowed_files_to_modify, retry_limit, next_state_on_recovered, next_state_on_retry_exhausted]

tracker_task_record:
  fields: [task_id, status, commit, files_changed, commands_run, key_outputs, marker, next_task, observed_regression_markers]
  required_fields: [task_id, status, commit, files_changed, commands_run, key_outputs, marker, next_task]
  enum_values:
    status: [PENDING, PLANNED, IN_PROGRESS, PASS, PASS_WITH_OBSERVED_REGRESSION, FAIL, HALTED, SKIPPED_BY_FUTURE_SCOPE, BLOCKED_BY_HUMAN_ACTION]
  optional_fields_notes:
    observed_regression_markers: >-
      list[string]; non-empty list of regression-class marker ids when status is
      PASS_WITH_OBSERVED_REGRESSION, absent or empty otherwise.

future_constraint_preservation_record:
  fields: [constraint_id, source_section, current_scope_impact, must_preserve_in_current_plan, forbidden_current_plan_regression, validator_or_review_check, future_phase_owner, out_of_scope_but_preserved]
  required_fields: [constraint_id, source_section, current_scope_impact, must_preserve_in_current_plan, forbidden_current_plan_regression, validator_or_review_check, future_phase_owner, out_of_scope_but_preserved]

phase_approval_record:
  fields: [phase, status, decision, accepted_phase_gate_report_commit, accepted_tracker_closure_commit, approval_packet_path, phase_gate_report_path, next_phase, next_phase_status]
  required_fields: [phase, status, decision, accepted_phase_gate_report_commit, accepted_tracker_closure_commit, approval_packet_path, phase_gate_report_path, next_phase, next_phase_status]
  enum_values:
    status: [APPROVED, REJECTED]
    decision: [PHASE_APPROVE, PHASE_REJECT, CHANGE_SCOPE]
  notes:
    - a B14.2 phase_approval_record on the gate_restored branch is the sole writer that clears the carried marker B15_RECRUITER_GATE_REGRESSION_UNDER_PUBLIC_SMOKE
    - a B14.2 phase_approval_record on the blocked branch does NOT clear the carried marker
    - a B14.2 PHASE_REJECT does NOT clear the carried marker

# ---- B14.2-specific records ----

public_surface_recruiter_gate_resmoke_record:
  description: declarative per-vantage-point B14_2-04 deliverable capturing the public-surface recruiter HTTPBasic gate observation under the repaired application/config; one record per required vantage point; literal URLs, hostnames, auth-keys, tokens, passwords, and non-loopback IP addresses are never recorded
  fields: [result_id, vantage_point, recruiter_gate_observed_status, coverage_item_outcomes, application_layer_only_no_network_trust_bypass_introduced, evidence_reference, resmoke_run_timestamp_utc, har_reference, validator, marker]
  required_fields: [result_id, vantage_point, recruiter_gate_observed_status, coverage_item_outcomes, application_layer_only_no_network_trust_bypass_introduced, evidence_reference, resmoke_run_timestamp_utc, har_reference, validator, marker]
  enum_values:
    vantage_point: [windows_local, mobile_cellular, other_wifi, vpn_or_external_tester]
    recruiter_gate_observed_status: [authenticated_access_only, unauthenticated_access_observed]
    application_layer_only_no_network_trust_bypass_introduced: [true, false]
  required_vantage_point_set: [windows_local, mobile_cellular, other_wifi, vpn_or_external_tester]
  coverage_item_outcomes_shape:
    fields: [five_curated_examples, five_degradations, whisper_provider, assemblyai_provider, upload_without_manual_ground_truth, upload_with_manual_ground_truth, upload_limit_enforced, provider_quota_state, mobile_layout]
    enum_values_per_field:
      five_curated_examples: [PASS, FAIL]
      five_degradations: [PASS, FAIL]
      whisper_provider: [PASS, FAIL]
      assemblyai_provider: [PASS, FAIL, EXPLICIT_NA_PROVIDER_DISABLED]
      upload_without_manual_ground_truth: [PASS, FAIL]
      upload_with_manual_ground_truth: [PASS, FAIL]
      upload_limit_enforced: [PASS, FAIL]
      provider_quota_state: enum_string_one_of_AssemblyAI_available_or_AssemblyAI_daily_quota_reached_or_AssemblyAI_quota_exhausted_or_AssemblyAI_disabled
      mobile_layout: [PASS, FAIL, NOT_APPLICABLE]
    rules:
      - upload_with_manual_ground_truth is recorded verbatim as PASS or FAIL; conversion of an operator-observed FAIL to PASS without matching evidence is forbidden
      - mobile_layout NOT_APPLICABLE is legal only when vantage_point is one of {windows_local, other_wifi, vpn_or_external_tester}; on vantage_point mobile_cellular it sets marker B14_2_BROUTE_REGRESSION_UNDER_PUBLIC_EXPOSURE
  rules:
    - evidence_reference must be a non-null operator-supplied non-secret token recorded via a human_action_result
    - har_reference must cite HAR-B14_2-PUBLIC-SURFACE-RECRUITER-GATE-RESMOKE-001
    - resmoke_run_timestamp_utc must be a non-secret ISO-8601 UTC timestamp
    - exactly four records must be authored, one per required_vantage_point_set value
    - a record authored without a non-null evidence_reference sets marker B14_2_PUBLIC_SURFACE_RESMOKE_FABRICATED
    - fewer than four records authored, or a vantage_point value outside the required set, sets marker B14_2_PUBLIC_SURFACE_RESMOKE_COVERAGE_GAP
    - a record that converts an operator-observed unauthenticated_access_observed to authenticated_access_only sets marker B14_2_PUBLIC_SURFACE_RESMOKE_FABRICATED
    - a record with application_layer_only_no_network_trust_bypass_introduced false sets marker B14_2_NETWORK_TRUST_AUTHORITY_DETECTED
  forbidden_values:
    no_literal_public_url: true
    no_literal_stable_hostname: true
    no_literal_non_loopback_ip_address: true
    no_tunnel_secret: true
    no_recruiter_or_admin_password: true

upload_with_gt_secondary_observation_record:
  description: declarative B14_2-05 deliverable classifying the upload_with_manual_ground_truth secondary observation carried verbatim from B15-05; classification is deterministically derived from the four B14_2-04 public_surface_recruiter_gate_resmoke_record entries
  fields: [observation_id, source_b15_05_har_id, source_b15_05_observation_verbatim, source_b14_2_04_record_ids, classification, classification_rationale, secondary_observation_routing_request_record, har_reference_conditional, validator, marker]
  required_fields: [observation_id, source_b15_05_har_id, source_b15_05_observation_verbatim, source_b14_2_04_record_ids, classification, classification_rationale, validator, marker]
  enum_values:
    classification: [linked_to_gate, independent_defer, re_smoke_evidence_pending]
  rules:
    - source_b15_05_har_id must equal HAR-B15-MULTI-NETWORK-SMOKE-001
    - source_b15_05_observation_verbatim must record the four per-vantage-point upload_with_manual_ground_truth observations as PASS or FAIL exactly as supplied by the B15-05 operator evidence; no conversion permitted
    - source_b14_2_04_record_ids must list all four B14_2-04 public_surface_recruiter_gate_resmoke_record ids; classification cannot be authored without the four ids present
    - classification linked_to_gate requires every B14_2-04 record to report recruiter_gate_observed_status authenticated_access_only AND coverage_item_outcomes.upload_with_manual_ground_truth PASS on every vantage point
    - classification independent_defer requires every B14_2-04 record to report recruiter_gate_observed_status authenticated_access_only AND coverage_item_outcomes.upload_with_manual_ground_truth FAIL on at least one vantage point; secondary_observation_routing_request_record must be present and har_reference_conditional must cite HAR-B14_2-UPLOAD-WITH-GT-DIAGNOSTIC-001 if the operator-supplied per-vantage classification tokens were required to disambiguate
    - classification re_smoke_evidence_pending requires at least one B14_2-04 record to report recruiter_gate_observed_status unauthenticated_access_observed
    - asserting linked_to_gate when any vantage point reports upload_with_manual_ground_truth FAIL sets marker B14_2_UPLOAD_WITH_GT_SILENT_ABSORPTION
    - inferring a cause not directly evidenced by the four B14_2-04 records sets marker B14_2_UPLOAD_WITH_GT_SILENT_ABSORPTION
  forbidden_values:
    no_conversion_of_fail_to_pass_without_matching_b14_2_04_evidence: true
    no_literal_public_url: true
    no_literal_stable_hostname: true
    no_literal_non_loopback_ip_address: true
    no_secret: true

secondary_observation_routing_request_record:
  description: declarative deliverable embedded in upload_with_gt_secondary_observation_record when classification is independent_defer; the record asks the orchestrator to route the secondary observation; B14.2 does not perform the routing
  fields: [routing_request_id, secondary_observation_id, requested_routing_target, rationale, validator, marker]
  required_fields: [routing_request_id, secondary_observation_id, requested_routing_target, rationale, validator, marker]
  enum_values:
    requested_routing_target: [PENDING_ORCHESTRATOR_DECISION]
  rules:
    - requested_routing_target is fixed at PENDING_ORCHESTRATOR_DECISION; B14.2 never invents a routing target
    - rationale cites the four B14_2-04 record ids by reference
  forbidden_values:
    no_invented_routing_target: true
    no_secret: true

b14_2_public_surface_claim_record:
  description: declarative B14_2-06 deliverable capturing the B14.2 phase-claim shape; SUCCESS_WITH_STABLE_NAMED_EXPOSURE is deliberately omitted because B14.2 is a repair microphase and cannot make a B15-shape full success claim
  fields: [claim_id, claim_status, all_four_resmoke_records_authenticated_access_only, all_four_resmoke_records_evidence_reference_non_null, recovery_packet_b15_recruiter_gate_pass, upload_with_gt_classification, explicit_blocker_id, blocker_recovery_packet, validator, marker]
  required_fields: [claim_id, claim_status, all_four_resmoke_records_authenticated_access_only, all_four_resmoke_records_evidence_reference_non_null, recovery_packet_b15_recruiter_gate_pass, upload_with_gt_classification, validator, marker]
  enum_values:
    claim_status: [GATE_RESTORED_VERIFIED_BY_OPERATOR_RESMOKE, BLOCKED_PENDING_HUMAN_ACTION, FAILED_PENDING_PHASE_RETURN]
    all_four_resmoke_records_authenticated_access_only: [true, false]
    all_four_resmoke_records_evidence_reference_non_null: [true, false]
    recovery_packet_b15_recruiter_gate_pass: [true, false]
    upload_with_gt_classification: [linked_to_gate, independent_defer, re_smoke_evidence_pending]
  rules:
    - if claim_status is GATE_RESTORED_VERIFIED_BY_OPERATOR_RESMOKE then all_four_resmoke_records_authenticated_access_only must be true and all_four_resmoke_records_evidence_reference_non_null must be true and recovery_packet_b15_recruiter_gate_pass must be true
    - if claim_status is BLOCKED_PENDING_HUMAN_ACTION then explicit_blocker_id must be non-null citing HAR-B14_2-PUBLIC-SURFACE-RECRUITER-GATE-RESMOKE-001 and blocker_recovery_packet must be non-null and recovery_packet_b15_recruiter_gate_pass must be false
    - if claim_status is FAILED_PENDING_PHASE_RETURN then all_four_resmoke_records_authenticated_access_only must be false and recovery_packet_b15_recruiter_gate_pass must be false
    - SUCCESS_WITH_STABLE_NAMED_EXPOSURE is not a legal claim_status value in this record
    - upload_with_gt_classification is recorded for every claim_status value
  forbidden_values:
    success_with_stable_named_exposure: forbidden
    no_literal_public_url: true
    no_literal_stable_hostname: true
    no_literal_non_loopback_ip_address: true
    no_secret: true

b14_2_recovery_packet_b15_recruiter_gate_record:
  description: declarative B14_2-06 deliverable encoding the RP-B15-RECRUITER-GATE-REGRESSION-UNDER-PUBLIC-SMOKE recovery-packet PASS shape; PASS only when the four B14_2-04 records together prove authenticated_access_only on every vantage point with non-null evidence_reference
  fields: [packet_id, marker_carried, source_b14_2_04_record_ids, all_four_authenticated_access_only, all_four_evidence_reference_non_null, carried_marker_eligible_for_clearance_at_phase_approval, validator]
  required_fields: [packet_id, marker_carried, source_b14_2_04_record_ids, all_four_authenticated_access_only, all_four_evidence_reference_non_null, carried_marker_eligible_for_clearance_at_phase_approval, validator]
  enum_values:
    marker_carried: [B15_RECRUITER_GATE_REGRESSION_UNDER_PUBLIC_SMOKE]
    all_four_authenticated_access_only: [true, false]
    all_four_evidence_reference_non_null: [true, false]
    carried_marker_eligible_for_clearance_at_phase_approval: [true, false]
  rules:
    - carried_marker_eligible_for_clearance_at_phase_approval is true iff all_four_authenticated_access_only is true and all_four_evidence_reference_non_null is true
    - this record does NOT itself clear the marker from tracker.markers; the orchestrator PHASE_APPROVE recording on the gate-restored branch is the sole writer

b14_2_closure_report:
  description: compact B14.2 closure report consumed at the B14_2-06 phase gate; summarizes the phase outcome, the claim status, the recovery-packet status, the upload-with-GT classification, the carried-marker disposition, and the future-constraint preservation set
  section_order: [STATE SNAPSHOT, PHASE OUTCOME, FINAL-VERIFICATION SENTINELS, CLAIM STATUS, RECOVERY PACKET STATUS, UPLOAD-WITH-GT CLASSIFICATION, CARRIED MARKER DISPOSITION, FUTURE CONSTRAINTS, BLOCKERS]
  required_fields: [state_snapshot, phase_outcome, final_verification_sentinels, claim_status, recovery_packet_status, upload_with_gt_classification, carried_marker_disposition, future_constraints, blockers]
  enum_values:
    phase_outcome: [B14_2_GATE_RESTORED, B14_2_BLOCKED_PENDING_HUMAN_ACTION, B14_2_FAILED_PENDING_PHASE_RETURN]

b14_2_human_action_packet:
  description: B14_2-04 deliverable; a collection of human_action_request records carrying the carried-resolved HARs by reference and the new B14.2 HAR
  fields: [packet_id, human_action_requests, carried_from_b14_1, carried_from_b15, new_in_b14_2, conditional_in_b14_2, validator, marker]
  required_fields: [packet_id, human_action_requests, carried_from_b14_1, carried_from_b15, new_in_b14_2, validator, marker]
  rules:
    - carried_from_b14_1 must list HAR-B14_1-STABLE-HOSTNAME-001 and HAR-B14_1-FUNNEL-CAPABILITY-001 with status resolved by-reference
    - carried_from_b15 must list HAR-B15-MULTI-NETWORK-SMOKE-001 with status resolved (operator observation set preserved verbatim)
    - new_in_b14_2 must list HAR-B14_2-PUBLIC-SURFACE-RECRUITER-GATE-RESMOKE-001
    - conditional_in_b14_2 may list HAR-B14_2-UPLOAD-WITH-GT-DIAGNOSTIC-001 (fires only if B14_2-04 leaves classification undecidable)
    - each entry in human_action_requests must match the human_action_request shape

b14_2_phase_gate_report:
  description: alias of phase_gate_report for B14_2-06; section_order and required_fields are identical to phase_gate_report
  same_as: phase_gate_report

context_window_hygiene_record:
  description: declarative record of when the orchestrator should prefer a new Claude window for context-window hygiene
  fields: [hygiene_id, trigger_kind, trigger_value, recommended_action]
  required_fields: [hygiene_id, trigger_kind, trigger_value, recommended_action]
  enum_values:
    trigger_kind: [task_count_within_phase, phase_boundary]
    recommended_action: [prefer_new_claude_window]

har_carry_record:
  description: declarative record of a human-action request carried forward from a predecessor phase (B14.1 or B15) into B14.2
  fields: [har_id, carried_from_phase, status_entering_b14_2, residual_blocker, blocks_b14_2_task, resolved_by_predecessor_approval_or_acceptance, required_human_evidence_shape]
  required_fields: [har_id, carried_from_phase, status_entering_b14_2, blocks_b14_2_task, resolved_by_predecessor_approval_or_acceptance, required_human_evidence_shape]
  enum_values:
    carried_from_phase: [B14.1, B15]
    status_entering_b14_2: [resolved_by_reference, resolved_with_observation_set, pre_declared_unresolved, pre_declared_conditional]
    resolved_by_predecessor_approval_or_acceptance: [true, false]

orchestrator_approval_record:
  fields: [approval_id, approval_packet, recorded_at_commit, accepted_report_commit, next_expected_task]
  required_fields: [approval_id, approval_packet, recorded_at_commit, accepted_report_commit, next_expected_task]

artifact_record:
  fields: [artifact_id, path, produced_by_task, exists, size_bytes, sha256, validator]
  required_fields: [artifact_id, path, produced_by_task, exists, size_bytes, sha256, validator]
