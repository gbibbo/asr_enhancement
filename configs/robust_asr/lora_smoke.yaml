# Robust ASR -- LoRA smoke split config (v3.4.7 Section 3510 P2.2)
#
# Produced by: P2.2 (LoRA smoke split config)
# Date: 2026-05-13
# Status: PASS (BLOCKED_OOD_PUBLIC active and non-blocking)
#
# Purpose: declares the smoke training subset (from lora_train) and the
# smoke evaluation subset (from validation) used by P3.1, plus the fixed
# LoRA hyperparameters, eval decode defaults, and timeouts. Audio IDs
# are listed verbatim so the membership check is fully reproducible
# without re-sampling.
#
# Determinism: stratified-by-speaker, no RNG. For each manifest, group
# rows by speaker_id, sort speakers by integer ID, sort each speaker's
# utterances by audio_id lexicographically, take the first per_speaker
# utterances. lora_train: 3 utt/speaker over 200 speakers = 600 rows.
# validation: 5 utt/speaker over 40 speakers = 200 rows. Seed 42 is the
# canonical training/eval seed for P3.1; the smoke sampler itself is
# RNG-free.
#
# References (P2 gate, Section 8): smoke splits reference rows present
# in librispeech_lora_train.parquet and librispeech_validation.parquet.

