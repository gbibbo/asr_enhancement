hyperparameters:
  steps_max: 200
  learning_rate: 1.0e-4
  batch_size: 8
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - out_proj
  seed: 42
  warmup_steps: 20
  optimizer: adamw
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  fp16: true

# Section 3 fixed decode defaults for Whisper evaluation.
eval_decode_defaults:
  task: transcribe
  language: en
  condition_on_previous_text: false
  without_timestamps: true
  beam_size: 1
  temperature: 0.0

timeouts:
  training_timeout_seconds: 14400
  eval_timeout_seconds: 1800
