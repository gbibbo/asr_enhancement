# Schema: docs/plans/robust_asr_agent_plan_v3_4_7.md Section 2.2
#
# Required fields per row:
#   path, class, permitted_use, allowed_tasks, validator,
#   checksum_required, large_artifact, commit_allowed, notes
#
# Default for any unclassified path:
#   class: no_touch | permitted_use: forbidden | allowed_tasks: []
#   validator: none | checksum_required: false | large_artifact: unknown
#   commit_allowed: false
#
# Classification rules (binding):
#   - Legacy trackers and plans: legacy_state, permitted_use: read_only,
#     commit_allowed: false. NOT forbidden, because P10.3 must read them.
#   - Mandatory no-touch patterns: no_touch, permitted_use: forbidden.
#   - Existing runtime code: implementation_reuse, permitted_use: read_only
#     (or extend_in_place with CHANGE_SCOPE approval for specific files).
#   - Active robust_asr paths: active_state, permitted_use: read_write.
#   - External host paths (non-git): data_root (datasets) or no_touch (binaries).

