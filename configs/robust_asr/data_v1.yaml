# Robust ASR — Data configs v1
#
# Produced by: P1.1 (data root inventory; rerun after LibriSpeech restore)
# Date: 2026-05-08
# Status of this config at write time: PARTIAL (BLOCKED_OOD_PUBLIC)
#   LibriSpeech train-clean-100, dev-clean, and test-clean are populated;
#   the four required split labels (lora_train, router_train, validation,
#   locked_test) all resolve to non-empty file lists and are speaker-disjoint.
#   No Section 1.1 OOD-real fallback resolves on host: Common Voice EN
#   has no transcripts and an empty clips/ directory; TED-LIUM R3 and
#   CHiME-6 are absent. Therefore claims_enabled.ood_real is set to
#   false at the tracker level (see Section 1.1 rule 4 / P1.1 rule 2).
#
# Schema notes:
#   - `datasets` enumerates every dataset root *declared*; per-dataset
#     `present_on_host` records whether the audio is actually populated.
#   - `splits` enumerates the six canonical robust_asr split labels.
#     For LibriSpeech, `source_dataset` and `source_subset` map each
#     label to a LibriSpeech subset; `speakers` is the deterministic
#     speaker partition decided in P1.1.
#   - `ood_real.selected_source` is null when no Section 1.1 fallback
#     resolves; `ood_real.blocked: true` then triggers BLOCKED_OOD_PUBLIC.

datasets:
