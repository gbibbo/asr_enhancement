    version: official_2014
    license_url: https://www.openslr.org/12
    license: CC BY 4.0
    access_method: local
    root: /mnt/fast/nobackup/scratch4weeks/gb0048/sources/librispeech/LibriSpeech
    present_on_host: true
    subsets:
      train-clean-100:
        present: true
        speakers_listed: 251
        speakers_with_audio: 251
        flac_files: 28539
        trans_files: 585
        hours_estimated: 102.30
        size_gib: 6.3
        notes: Restored from openslr.org/12 train-clean-100.tar.gz; tar
               extraction exit code 0; gzip integrity OK.
      train-clean-360:
        present: false
        speakers_listed: 0
        speakers_with_audio: 0
        flac_files: 0
        hours_estimated: 0.0
        notes: Subset not restored at this rerun. Optional; required only
               if larger LoRA scale is requested in P3/P4. P1.1 does not
               require it.
      dev-clean:
