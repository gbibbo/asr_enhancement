# OOD-real preference order (Section 1.1).
# Selected source resolves only if its Section 1.1 approval predicate holds.
ood_real:
  preference_order: [common_voice, tedlium_r3, chime6]
  selected_source: null
  blocked: true
  blocked_reason: >
    Common Voice clips/ empty and no transcripts; TED-LIUM R3 and CHiME-6
    absent. No Section 1.1 OOD-real source resolves on host.
    Section 1.1 rule 4 / P1.1 rule 2 -> BLOCKED_OOD_PUBLIC,
    claims_enabled.ood_real=false (tracker).

# Canonical six split labels for robust_asr.
# LibriSpeech speaker partitions are deterministic: sort all
# train-clean-100 speaker dirs by integer ID, then
#   router_train = every 5th (indices 0, 5, 10, ...)   -> 51 speakers
#   lora_train   = the remaining 200 speakers
# This produces speaker-disjoint lora_train and router_train partitions
# and trivially preserves the LibriSpeech corpus-level disjointness
# vs dev-clean and test-clean (which share no speakers with
# train-clean-100 by construction).
