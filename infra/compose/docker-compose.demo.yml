name: asr-demo

x-demo-build: &demo-build
  context: ../..
  dockerfile: infra/compose/Dockerfile.demo

x-demo-volumes: &demo-volumes
  - ${DEMO_RUNTIME_ROOT:-/home/gbibbo/asr_enhancement_runtime}:${DEMO_RUNTIME_ROOT:-/home/gbibbo/asr_enhancement_runtime}
  - ../../config:/app/config:ro

x-demo-env: &demo-env
  DEMO_MODE: "true"
  DEMO_RUNTIME_ROOT: ${DEMO_RUNTIME_ROOT:-/home/gbibbo/asr_enhancement_runtime}
  DEMO_DB_PATH: ${DEMO_DB_PATH:-}
  DEMO_UPLOAD_DIR: ${DEMO_UPLOAD_DIR:-}
  DEMO_CACHE_DIR: ${DEMO_CACHE_DIR:-}
  DEMO_ARTIFACTS_DIR: ${DEMO_ARTIFACTS_DIR:-}
  DEMO_LOGS_DIR: ${DEMO_LOGS_DIR:-}
  DEMO_WORKER_CONCURRENCY: ${DEMO_WORKER_CONCURRENCY:-1}
  DEMO_QUEUE_MAX: ${DEMO_QUEUE_MAX:-10}
  DEMO_UPLOAD_LIMIT_BYTES: ${DEMO_UPLOAD_LIMIT_BYTES:-5242880}
  DEMO_UPLOAD_MAX_DURATION_SECONDS: ${DEMO_UPLOAD_MAX_DURATION_SECONDS:-30}
  ENHANCER_VERSION: ${ENHANCER_VERSION:-bypass}
  # AssemblyAI key (optional cloud ASR). Empty default so no secret is committed;
  # supply via host .env.demo. Shared here so BOTH demo-api (provider status) and
  # demo-worker (the actual transcription) see it — otherwise uploads that select
  # AssemblyAI fail in the worker even though status reports "available".
  ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
  ADMIN_STATS_USERNAME: ${ADMIN_STATS_USERNAME:-admin}
  ADMIN_STATS_PASSWORD: ${ADMIN_STATS_PASSWORD:-}
  # B14.0/B14.2 recruiter HTTPBasic gate. Sole authority for public /demo/*
  # access. Credentials use empty defaults so the compose file never holds real
  # values; supply RECRUITER_USERNAME / RECRUITER_PASSWORD via host .env.demo
  # only. With either unset the gate stays fail-closed (401 for every request),
  # which is the correct posture for a misconfigured host.
  RECRUITER_USERNAME: ${RECRUITER_USERNAME:-}
  RECRUITER_PASSWORD: ${RECRUITER_PASSWORD:-}
  # B14.1 public-exposure flag. Default false (loopback-only). Set true on the
  # host only once the Tailscale Funnel tunnel is provisioned. This flag does
  # NOT relax the recruiter gate; the gate is the sole authority regardless.
  PUBLIC_DEMO_EXPOSURE: ${PUBLIC_DEMO_EXPOSURE:-false}
  # Pre-built Next.js static export served by the demo API behind the recruiter
  # gate (single-origin UI). Point at a directory inside the runtime root (which
  # is bind-mounted at the same path), e.g.
  # ${DEMO_RUNTIME_ROOT}/frontend. Empty => no UI served.
  DEMO_FRONTEND_DIR: ${DEMO_FRONTEND_DIR:-}
  DEMO_ASSEMBLYAI_DAILY_SOFT_CAP_USD: ${DEMO_ASSEMBLYAI_DAILY_SOFT_CAP_USD:-5.0}
  DEMO_ASSEMBLYAI_WARNING_CAP_USD: ${DEMO_ASSEMBLYAI_WARNING_CAP_USD:-35.0}
  DEMO_ASSEMBLYAI_HARD_CAP_USD: ${DEMO_ASSEMBLYAI_HARD_CAP_USD:-45.0}
  DEMO_ASSEMBLYAI_USD_PER_SECOND: ${DEMO_ASSEMBLYAI_USD_PER_SECOND:-0.000103}
  # B12.1 lightweight observability. File logging is on by default in the
  # demo Compose so done-when 4 ("logs rotate") is satisfied on the actual
  # RP5 runtime container; the library default remains False so unit tests
  # stay stderr-only. Operators can disable per-host with DEMO_LOG_TO_FILE=false.
  DEMO_LOG_TO_FILE: ${DEMO_LOG_TO_FILE:-true}
  DEMO_LOG_MAX_BYTES: ${DEMO_LOG_MAX_BYTES:-10485760}
  DEMO_LOG_BACKUP_COUNT: ${DEMO_LOG_BACKUP_COUNT:-5}
  DEMO_LOG_FILENAME_PREFIX: ${DEMO_LOG_FILENAME_PREFIX:-demo}
  DEMO_ADMIN_RECENT_ERRORS: ${DEMO_ADMIN_RECENT_ERRORS:-20}
  # B12.2 email alerts. Disabled by default. SMTP credentials use empty defaults
  # so the compose file never holds real values; supply via host .env.demo only.
  DEMO_ALERT_EMAIL_ENABLED: ${DEMO_ALERT_EMAIL_ENABLED:-false}
  DEMO_ALERT_EMAIL_TO: ${DEMO_ALERT_EMAIL_TO:-}
  DEMO_ALERT_EMAIL_FROM: ${DEMO_ALERT_EMAIL_FROM:-}
  DEMO_ALERT_SMTP_HOST: ${DEMO_ALERT_SMTP_HOST:-}
  DEMO_ALERT_SMTP_PORT: ${DEMO_ALERT_SMTP_PORT:-587}
  DEMO_ALERT_SMTP_USERNAME: ${DEMO_ALERT_SMTP_USERNAME:-}
  DEMO_ALERT_SMTP_PASSWORD: ${DEMO_ALERT_SMTP_PASSWORD:-}
  DEMO_ALERT_SMTP_USE_STARTTLS: ${DEMO_ALERT_SMTP_USE_STARTTLS:-true}
  DEMO_ALERT_SMTP_TIMEOUT_SECONDS: ${DEMO_ALERT_SMTP_TIMEOUT_SECONDS:-10}
  DEMO_ALERT_DISK_THRESHOLD_PERCENT: ${DEMO_ALERT_DISK_THRESHOLD_PERCENT:-80.0}
  DEMO_ALERT_DISK_COOLDOWN_HOURS: ${DEMO_ALERT_DISK_COOLDOWN_HOURS:-6}
  DEMO_ALERT_HEALTH_CONSECUTIVE_FAILURES: ${DEMO_ALERT_HEALTH_CONSECUTIVE_FAILURES:-3}
  DEMO_ALERT_HEALTH_COOLDOWN_MINUTES: ${DEMO_ALERT_HEALTH_COOLDOWN_MINUTES:-30}
  DEMO_ALERT_HEALTH_URL: ${DEMO_ALERT_HEALTH_URL:-http://localhost:8001/demo/health}
  DEMO_ALERT_HEALTH_STATE_FILE: ${DEMO_ALERT_HEALTH_STATE_FILE:-}

services:
  demo-api:
    build: *demo-build
    # Auto-start on boot and after crashes. With the Docker service enabled,
    # the demo comes back on its own after a power cycle without any manual step.
    restart: unless-stopped
    environment: *demo-env
    command: uvicorn services.api.app.demo_main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes: *demo-volumes
    # /demo/health is behind the recruiter HTTPBasic gate (B14.0/B14.2), so the
    # container liveness probe authenticates with the recruiter credentials from
    # the container environment. No secret literal is written here; the values
    # come from RECRUITER_USERNAME / RECRUITER_PASSWORD in the host .env.demo.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,base64,urllib.request as u; a=base64.b64encode(('%s:%s'%(os.environ.get('RECRUITER_USERNAME',''),os.environ.get('RECRUITER_PASSWORD',''))).encode()).decode(); u.urlopen(u.Request('http://localhost:8000/demo/health', headers={'Authorization':'Basic '+a}), timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  demo-worker:
    build: *demo-build
    restart: unless-stopped
    environment: *demo-env
    command: python -m services.worker.app.demo_worker_main
    volumes: *demo-volumes
