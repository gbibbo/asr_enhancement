# funnel_config.template.yaml
#
# Public-exposure tunnel configuration template for the demo-rp5-v1
# profile (B14.1). PLACEHOLDER ONLY: this file contains no real Tailscale
# auth-key, no Cloudflare token, no stable-hostname literal, and no
# public URL literal. The real tunnel configuration is operator-owned
# and lives on the demo host only, populated from host environment
# variables that are never committed to this repository.
#
# Authoring scope:
#   path lock: PL-B14_1-TUNNEL-TEMPLATE (max 1 file)
#   owning task: B14_1-04 (template authoring, repo-only)
#   B14_1-04 starts no process, binds no port, and exposes no surface
#
# Readiness claim recorded by this template:
#   ready_to_run: false
#   reason: HAR-B14_1-FUNNEL-CAPABILITY-001 result for B14_1-04 records
#     tailscale_authkey_supplied_as_host_env_TAILSCALE_AUTHKEY = false.
#     The Tailscale auth-key is not present on the host environment, so
#     no tunnel-start action may be attempted from this template. The
#     operator must provision TAILSCALE_AUTHKEY as a host env var
#     before any host service is asked to run the tunnel.
#
# Companion HAR:
#   HAR-B14_1-STABLE-HOSTNAME-001 remains pre-declared and unresolved.
#   The stable public hostname is referenced ONLY by env-var name
#   (PUBLIC_DEMO_STABLE_HOSTNAME). The literal hostname is never written
#   into this template, the tracker, any approval packet, or any other
#   committed file.
#
# Provider selection (HAR-B14_1-FUNNEL-CAPABILITY-001):
#   tailscale_account_funnel_capability_enabled = true
#   cloudflare_tunnel_alternative_token_supplied_as_host_env = explicit_NA
#   Tailscale Funnel is the selected provider; no Cloudflare token is
#   referenced here.
#
# Operator service restart policy (HAR-B14_1-FUNNEL-CAPABILITY-001):
#   tunnel_run_as_service_restart_policy_string = on-failure
#   This is an OPERATOR-SUPPLIED SERVICE POLICY recorded for the host
#   service unit that the operator will install AFTER auth-key
#   provisioning. It is not a runtime default of this template (this
#   template does not execute), and it is not a systemd unit file
#   (B14.1 forbids systemd installation inside any task; the unit file
#   itself is host-only and not part of this repo).

schema_version: b14_1.funnel_config.template.v1
profile: demo-rp5-v1

tunnel:
  provider: tailscale_funnel
  # Tailscale authentication key, referenced ONLY by env-var name.
  # The literal value is never written here and is provisioned by the
  # operator as a host environment variable.
  auth_key_env_var_name: TAILSCALE_AUTHKEY
  auth_key_supplied_as_host_env: false
  # Stable public hostname, referenced ONLY by env-var name.
  # The literal value is never written here.
  stable_hostname_env_var_name: PUBLIC_DEMO_STABLE_HOSTNAME
  stable_hostname_supplied_by_reference: false
  # Cloudflare tunnel alternative is not selected for this profile.
  cloudflare_token_env_var_name: null
  cloudflare_token_supplied_as_host_env: explicit_NA

application:
  # Public-exposure flag, read by the FastAPI app from the host
  # environment. The literal value is never written here.
  public_exposure_flag_env_var_name: PUBLIC_DEMO_EXPOSURE
  # FastAPI listens on loopback. The Funnel layer terminates TLS upstream
  # and forwards to the loopback address; FastAPI still enforces the
  # recruiter HTTPBasic gate end-to-end (B14.0 invariant preserved).
  upstream_loopback_address: 127.0.0.1
  upstream_loopback_port: 8001
  # The recruiter HTTPBasic gate (B14.0) remains the SOLE authority for
  # public /demo/* access under PUBLIC_DEMO_EXPOSURE=true. No
  # application-layer authority decision is keyed on network origin,
  # client IP, source interface, Tailscale identity, X-Forwarded-For,
  # or any other forwarded header.
  application_layer_authority: recruiter_httpbasic_only

service:
  # Operator-supplied service restart policy. Recorded here as a
  # documentation field only. This template does not install, enable,
  # or execute any service. The host systemd unit is operator-owned
  # and not part of this repository.
  restart_policy_operator_supplied: on-failure
  install_action: operator_only_not_executed_by_b14_1
  install_location: host_only_not_in_repo

readiness:
  ready_to_run: false
  reason: TAILSCALE_AUTHKEY is not supplied as a host environment variable; operator action is required before any tunnel-start. B14_1-04 is repo-only template authoring and starts no process.
  residual_blockers:
    - HAR-B14_1-FUNNEL-CAPABILITY-001.tailscale_authkey_supplied_as_host_env_TAILSCALE_AUTHKEY=false
    - HAR-B14_1-STABLE-HOSTNAME-001.pre_declared_unresolved
