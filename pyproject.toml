[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-enhancement-platform"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "minio>=7.2",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "soundfile>=0.12",
    "scipy>=1.11",
    "numpy>=1.24",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "PyYAML>=6",
]
lint = [
    "ruff==0.6.9",
    "mypy==1.11.2",
]
demo = [
    "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["integration"]
markers = [
    "live_provider: requires RUN_LIVE_ASSEMBLYAI_TEST=1 and ASSEMBLYAI_API_KEY; never runs in CI",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "alembic/versions",
    "services/frontend",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[tool.setuptools.packages.find]
where = ["."]
